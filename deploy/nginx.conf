server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = / { try_files /index.html =404; }
    location ~ ^/(index\.html|styles\.css|app\.js|settings\.js|data\.js|favicon\.svg|assets/(geist\.ttf|Geist-OFL\.txt|grip-sharing-v1\.png))$ { try_files $uri =404; }
    location / { return 404; }
}
